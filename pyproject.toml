[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saw-livetrack"
version = "0.2.2"
description = "Shared code for the Live Track Home Assistant integrations: source-agnostic fix tracking, GTFS and GTFS-Realtime, and an Amtraker API client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "StrausbergAutomationWorks" }]
keywords = ["home-assistant", "train-tracking", "geo-location", "amtrak", "via-rail", "brightline", "amtraker", "gtfs", "gtfs-realtime", "commuter-rail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# The bindings: only saw_livetrack.gtfs.realtime.decode() needs them. Pinned once, here.
# tzdata: schedule.py reads GTFS times in the agency's zone through zoneinfo. Where
# the OS has no IANA database (Windows; slim containers) ZoneInfo fails and
# next_stops publishes nothing, silently. Measured in a clean Windows venv
# during the 0.2.0 release check: every Metra next stop missing until it was installed.
gtfs = ["gtfs-realtime-bindings==1.0.0", "tzdata"]

[project.urls]
Homepage = "https://github.com/StrausbergAutomationWorks/LiveTrackCore"
Issues = "https://github.com/StrausbergAutomationWorks/LiveTrackCore/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
