[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saw-livetrack"
version = "0.2.17"
description = "Shared code for the Live Track Home Assistant integrations: source-agnostic fix tracking, GTFS and GTFS-Realtime, time zones from a coordinate, Finland's trains from Fintraffic Digitraffic, Spain's Renfe commuter feed, the Live Track aircraft marker icons, the EnforcementAircraft list reader, one shared ADS-B poll, the FAA aircraft registry, and an Amtraker API client"
readme = "README.md"
requires-python = ">=3.11"
# The code is MIT. The aircraft icons by ADS-B Radar are under their author's own terms
# (a backlink), stated in aircraft_icons/ATTRIBUTION.md, which ships with them.
license = "MIT AND LicenseRef-ADSB-Radar-Icons"
license-files = ["LICENSE", "src/saw_livetrack/aircraft_icons/ATTRIBUTION.md"]
authors = [{ name = "StrausbergAutomationWorks" }]
keywords = ["home-assistant", "train-tracking", "geo-location", "amtrak", "via-rail", "brightline", "amtraker", "gtfs", "gtfs-realtime", "commuter-rail", "finland", "digitraffic", "spain", "renfe", "cercanias", "aircraft", "ads-b", "law-enforcement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# The bindings: only saw_livetrack.gtfs.realtime.decode() needs them. Pinned once, here.
# tzdata: schedule.py reads GTFS times in the agency's zone through zoneinfo. Where
# the OS has no IANA database (Windows; slim containers) ZoneInfo fails and
# next_stops publishes nothing, silently. Measured in a clean Windows venv
# during the 0.2.0 release check: every Metra next stop missing until it was installed.
gtfs = ["gtfs-realtime-bindings==1.0.0", "tzdata"]
# saw_livetrack.zones (0.2.5): the IANA zone at any coordinate. tzfpy: MIT code, Rust,
# no dependencies, wheels for musllinux x86_64 and aarch64; its embedded data is
# Timezone Boundary Builder 2026d, ODbL v1.0. tzdata for the same reason as above.
zones = ["tzfpy==2.1.0", "tzdata"]

[project.urls]
Homepage = "https://github.com/StrausbergAutomationWorks/LiveTrackCore"
Issues = "https://github.com/StrausbergAutomationWorks/LiveTrackCore/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The aircraft icons and their attribution ship INSIDE the package (0.2.11).
[tool.setuptools.package-data]
"saw_livetrack.aircraft_icons" = ["icons/*.svg", "ATTRIBUTION.md"]

[tool.setuptools.package-dir]
"" = "src"
